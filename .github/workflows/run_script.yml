name: Avtomatik Ishga Tushirish

on:
  schedule:
    # Har kuni UTC bo'yicha soat 06:00 da avtomatik ishga tushadi
    - cron: '0 6 * * *'
  # Qo'lda xohlagan payt ishga tushirish tugmasi
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriy kodini olish
        uses: actions/checkout@v4

      - name: Python muhitini o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install requests google-generativeai

      - name: Skriptni ishga tushirish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python avtomat_youtube_agent.py
          
